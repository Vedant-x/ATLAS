name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # public repo: Actions minutes are free; live scores also refresh in the browser
  workflow_dispatch:

permissions:
  contents: write # saves the track record to the track-record branch
  issues: write # opens/closes the automatic data-alert issue
  actions: write # queues the next refresh (GitHub's scheduler alone runs only every few hours)
  pages: write
  id-token: write

concurrency:
  group: pages
  # Nothing cancels a running build: a push waits its turn like the cron and the self-queued refresh
  # (one waiting run at most; a newer one replaces it). When a push cancelled the build in progress,
  # merges a few minutes apart cancelled every build in turn and the site went unpublished for hours.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }} # empty unless email alerts are set up
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      # Pinned dependencies (package-lock.json): esbuild bundles the site; postinstall builds vendor/.
      - run: npm ci
      - run: npm test
      - run: node scripts/pages.mjs
        timeout-minutes: 14
        env:
          # Bookmaker odds (The Odds API): the ODDS_API_KEY repository secret turns them on; ODDS_*
          # repository variables tune them (default: every in-season sport, the month's credits spent at
          # an even pace, region eu (Pinnacle and a dozen books), each sport refreshed when 12 hours old).
          # Empty values leave the defaults.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_HOURS: ${{ vars.ODDS_HOURS }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_REGIONS: ${{ vars.ODDS_REGIONS }}
          ODDS_MAX_SPORTS: ${{ vars.ODDS_MAX_SPORTS }}
      # The data contract (js/contract.js) on what is about to be published: reported in the log and
      # as a warning, never blocking (the last good site stays up either way).
      - name: Data contract
        continue-on-error: true
        run: |
          node scripts/check-data.mjs dist/pages/data --min-events 300 || { echo "::warning::The data contract check failed (details in this step's log)"; exit 1; }
      # Track record: history lives on the track-record branch (created on the first run). If the
      # branch exists, its history must load: record.mjs stops the build otherwise, so a failed
      # checkout can never restart the record from empty.
      - name: Does the track record exist
        id: trackbranch
        run: echo "exists=$(git ls-remote --heads origin track-record | grep -q track-record && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Load track record
        uses: actions/checkout@v5
        with: { ref: track-record, path: track }
        continue-on-error: true
      - name: Update track record
        env: { TRACK_REQUIRED: '${{ steps.trackbranch.outputs.exists }}' }
        run: node scripts/record.mjs track/picks.json dist/pages/data/index.json dist/pages/data/track.json track/audit.json
      # Evidence timeline: what changed since the previous build (kept on the track-record branch).
      - name: Update change timeline
        continue-on-error: true
        run: node scripts/changes.mjs track dist/pages/data/index.json dist/pages/data/changes.json
      # Data alert: a GitHub issue mentioning the owner (GitHub emails them) for problems that last 3
      # builds in a row, closed when data recovers. One-off feed timeouts never email.
      - name: Data alert
        id: alert
        uses: actions/github-script@v8
        with:
          script: return require('./scripts/alert.cjs')({ github, context, core })
      # Optional direct email: set secrets ALERT_EMAIL, MAIL_USERNAME and MAIL_PASSWORD (a Gmail app password).
      - name: Email data alert
        if: steps.alert.outputs.notify != 'false' && steps.alert.outputs.notify != '' && env.MAIL_USERNAME != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.ALERT_EMAIL }}
          from: "ATLAS alerts <${{ secrets.MAIL_USERNAME }}>"
          subject: "${{ steps.alert.outputs.notify == 'recovered' && 'ATLAS data recovered' || 'ATLAS data alert - the site is missing data' }}"
          body: |
            ${{ steps.alert.outputs.notify == 'recovered' && 'The latest build found no data problems.' || steps.alert.outputs.summary }}

            Details: ${{ github.server_url }}/${{ github.repository }}/issues?q=label%3Adata-alert
      # Saved before publishing: the site never shows picks the history doesn't hold. If another run
      # saved first (the push is rejected), this run stops without publishing; the next run starts
      # from the newer history.
      - name: Save track record
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd track
          if ! git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            rm -rf .git && git init -q && git checkout -q --orphan track-record
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "atlas-bot" && git config user.email "atlas-bot@users.noreply.github.com"
          for f in picks.json audit.json snapshot.json changes.json alert-state.json; do [ -f "$f" ] && git add "$f"; done
          git commit -qm "Track record $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:track-record
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages
      # A push cancels a run that may be mid-publish, and GitHub then refuses the next publish for a
      # short while ("deployment in progress"): retry once after a pause instead of failing the run
      # (and emailing about it).
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying the publish
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
      # Self-refreshing: GitHub runs the cron above only every few hours, so each run queues the
      # next one ~8 minutes after it finishes. Meanwhile it publishes live scores every 20 seconds for
      # sources whose sites block browsers (NPB, KBO, esports, eSoccer) to the live-data branch, which the site polls. A newer run (push,
      # cron) cancels a waiting one via the concurrency group, so there is only ever one chain; the cron
      # restarts it if it ever breaks.
      - name: Live scores, then queue the next refresh
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }} # the chain continues even after a failed build
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p lane && cd lane && git init -q && git checkout -q --orphan live-data
          git config user.name "atlas-bot" && git config user.email "atlas-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Pushed only when the file changed (a score moved, or the 2-minute heartbeat while games are on).
          for i in $(seq 1 20); do
            timeout 60 node ../scripts/live-lane.mjs live.json ../dist/pages/data/index.json || true
            if [ -f live.json ] && { ! git rev-parse -q --verify HEAD >/dev/null || ! git diff --quiet HEAD -- live.json; }; then
              git add live.json && { git commit -q --amend -m "Live scores" 2>/dev/null || git commit -q -m "Live scores"; }
              git push -q -f origin HEAD:live-data || true
            fi
            sleep 18
          done
          cd ..
          # One chain only: skip if a run (cron, push) is already waiting.
          if [ -z "$(gh run list --workflow pages.yml --json status --jq '.[] | select(.status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested") | .status')" ]; then
            gh workflow run pages.yml --ref main
          fi
