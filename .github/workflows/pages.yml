name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *' # public repo: Actions minutes are free; live scores also refresh in the browser
  workflow_dispatch:

permissions:
  contents: write # saves the track record to the track-record branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/pages.mjs
      # Track record: history lives on the track-record branch (created on the first run).
      - name: Load track record
        uses: actions/checkout@v4
        with: { ref: track-record, path: track }
        continue-on-error: true
      - name: Update track record
        run: node scripts/record.mjs track/picks.json dist/pages/data/index.json dist/pages/data/track.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Save track record
        continue-on-error: true # a concurrent run may have pushed first; the next run catches up
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cd track
          if ! git rev-parse -q --verify HEAD >/dev/null 2>&1; then
            rm -rf .git && git init -q && git checkout -q --orphan track-record
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "atlas-bot" && git config user.email "atlas-bot@users.noreply.github.com"
          git add picks.json
          git commit -qm "Track record $(date -u +%FT%TZ)" || exit 0
          git push -q origin HEAD:track-record
