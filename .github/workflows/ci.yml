name: CI
# Once per pull request (it used to run twice: on the push and again on the pull request), and on
# demand. The newest push to a pull request cancels the run still going for an older one.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read # tests only: no write access
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot install Chromium.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      # Pinned dependencies from package-lock.json; postinstall builds vendor/ (scripts/vendor.mjs).
      - run: npm ci
      # The deploy workflow's script action, proven to resolve here before it runs on main.
      - uses: actions/github-script@v8
        with: { script: "core.info('github-script@v8 resolves')" }
      - run: npm run lint
      - run: npm test
      - name: Unit tests at every hour of the day (the live build runs them before publishing)
        timeout-minutes: 5
        run: for h in $(seq 1 23); do SHIFT_H=$h node --import ./test/support/clock.mjs --test test/*.test.mjs > /tmp/clock.log 2>&1 || { echo "Tests fail with the clock $h h ahead"; grep -E '^not ok' /tmp/clock.log; exit 1; }; done
      - name: Build Pages site against live sources (bundled, as published)
        timeout-minutes: 12
        run: node scripts/pages.mjs
        env:
          # The sports list (free) and the site's last odds merged onto the board; no paid fetches, so
          # pushes don't eat the month's credits (the live build spends them at an even pace).
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_SPORTS: '0'
          ODDS_REGIONS: eu
          # TheSportsDB's free key is shared and rate limited: test builds only reuse the live site's cache.
          TSDB_BUDGET: '0'
          # Stake's prices: test builds reuse the live site's, and spend none of the month's requests.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDSPAPI_BUDGET: '0'
      - name: Data contract (the real build's data, not the test board)
        run: node scripts/check-data.mjs dist/pages/data --min-events 300
      - name: Track record dry run (empty history, live results)
        timeout-minutes: 4
        run: node scripts/record.mjs /tmp/track/picks.json dist/pages/data/index.json /tmp/track/track.json /tmp/track/audit.json
      - name: Second results source against real picks (the baseline's final results, confirmed live)
        # A check against outside sites: it reports, it never holds up a release.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/second
          zcat test/fixtures/baseline/picks-2026-10-18.json.gz | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(h.filter((p) => p.type !== "multi" && ["won","lost","push"].includes(p.status))))' > /tmp/second/picks.json
          RECORD_MAX_LOOKUPS=1000 node scripts/record.mjs /tmp/second/picks.json dist/pages/data/index.json /tmp/second/track.json /tmp/second/audit.json
      - name: Browser tests (fixed board, the bundled pages in Chromium)
        timeout-minutes: 10
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Keep the browser-test screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with: { name: ui-screenshots, path: test-results/, if-no-files-found: ignore }
