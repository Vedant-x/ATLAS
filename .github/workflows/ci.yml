name: CI
on:
  push:
    branches: ['claude/**']
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Build Pages site against live sources
        run: node scripts/pages.mjs
