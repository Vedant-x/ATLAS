name: CI
on:
  push:
    branches: ['claude/**']
  pull_request:
permissions:
  contents: read # tests only: no write access

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Build Pages site against live sources
        run: node scripts/pages.mjs
      - name: Track record dry run (empty history, live results)
        run: node scripts/record.mjs /tmp/track/picks.json dist/pages/data/index.json /tmp/track/track.json
