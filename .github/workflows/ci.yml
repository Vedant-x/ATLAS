name: CI
on:
  push:
    branches: ['claude/**']
  pull_request:
permissions:
  contents: read # tests only: no write access

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Build Pages site against live sources
        run: node scripts/pages.mjs
        env:
          # The sports list (free) and the site's last odds merged onto the board; no paid fetches, so
          # pushes don't eat the month's credits (the live build spends them at an even pace).
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_SPORTS: '0'
          ODDS_REGIONS: eu
      - name: Track record dry run (empty history, live results)
        run: node scripts/record.mjs /tmp/track/picks.json dist/pages/data/index.json /tmp/track/track.json /tmp/track/audit.json
      - name: Second results source against real picks (the baseline's final results, confirmed live)
        # Results from the 18 Oct baseline copy are re-read for confirmation (from the league's own feed
        # where one exists). Nothing is saved; the log shows how often the two sources agree. Finds
        # nothing to confirm once the baseline is more than 7 days old.
        run: |
          mkdir -p /tmp/second
          zcat baseline/picks-2026-10-18.json.gz | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(h.filter((p) => p.type !== "multi" && ["won","lost","push"].includes(p.status))))' > /tmp/second/picks.json
          RECORD_MAX_LOOKUPS=1000 node scripts/record.mjs /tmp/second/picks.json dist/pages/data/index.json /tmp/second/track.json /tmp/second/audit.json
          node -e 'for (const c of JSON.parse(require("fs").readFileSync("/tmp/second/audit.json","utf8"))) console.log(`Correction: ${c.key} ${c.from} -> ${c.to} (${c.score ?? ""}) ${c.source}: ${c.reason}`)'
      - name: Browser tests (fixed board, the built pages in Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Keep the browser-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-screenshots, path: test-results/, if-no-files-found: ignore }
