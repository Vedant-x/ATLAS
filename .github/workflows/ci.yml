name: CI
on:
  push:
    branches: ['claude/**']
  pull_request:
permissions:
  contents: read # tests only: no write access

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Build Pages site against live sources
        run: node scripts/pages.mjs
        env:
          # The sports list (free) and the site's last odds merged onto the board; no paid fetches, so
          # pushes don't eat the month's credits (the live build spends them at an even pace).
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_MAX_SPORTS: '0'
          ODDS_REGIONS: eu
          # TheSportsDB's free key is shared and rate limited: test builds reuse the live site's copy.
          TSDB_KEEP_MIN: '1440'
      - name: Track record dry run (empty history, live results)
        run: node scripts/record.mjs /tmp/track/picks.json dist/pages/data/index.json /tmp/track/track.json /tmp/track/audit.json
      - name: Second results source against real picks (the baseline's final results, confirmed live)
        # A check against outside sites: it reports, it never holds up a release.
        continue-on-error: true
        timeout-minutes: 4
        # Results from the 18 Oct baseline copy are re-read for confirmation (from the league's own feed
        # where one exists). Nothing is saved; the log shows how often the two sources agree. Finds
        # nothing to confirm once the baseline is more than 7 days old.
        run: |
          mkdir -p /tmp/second
          zcat baseline/picks-2026-10-18.json.gz | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(h.filter((p) => p.type !== "multi" && ["won","lost","push"].includes(p.status))))' > /tmp/second/picks.json
          RECORD_MAX_LOOKUPS=1000 node scripts/record.mjs /tmp/second/picks.json dist/pages/data/index.json /tmp/second/track.json /tmp/second/audit.json
          node -e 'for (const c of JSON.parse(require("fs").readFileSync("/tmp/second/audit.json","utf8"))) console.log(`Correction: ${c.key} ${c.from} -> ${c.to} (${c.score ?? ""}) ${c.source}: ${c.reason}`)'
      - name: Stuck results settle (the baseline's ungraded Dota 2, LoL, Valorant and UFC picks, read live)
        # A check against outside sites: it reports, it never holds up a release.
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mkdir -p /tmp/stuck
          zcat baseline/picks-2026-10-18.json.gz | node -e 'const h=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(h.filter((p) => p.type !== "multi" && /^(atlas\/(dota2|lol|valorant)|mma\/)/.test(p.leaguePath) && ["pending","unresolved"].includes(p.status))))' > /tmp/stuck/picks.json
          RECORD_MAX_LOOKUPS=1000 node scripts/record.mjs /tmp/stuck/picks.json dist/pages/data/index.json /tmp/stuck/track.json /tmp/stuck/audit.json
          node -e 'const h=JSON.parse(require("fs").readFileSync("/tmp/stuck/picks.json","utf8")); const c={}; for (const p of h.filter((p) => p.recordedAt < Date.parse("2026-10-19"))) { const k=p.leaguePath+" "+p.status; c[k]=(c[k]||0)+1 } console.log("Stuck picks now:", JSON.stringify(c))'
          # The Dota 2 second source (OpenDota) on the same picks: found and agreeing with bo3.gg?
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { secondReader } from "./js/results2.js"; import { gradePick } from "./js/track.js";
            const read = secondReader(async (u) => { const r = await fetch(u, { signal: AbortSignal.timeout(30000) }); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); });
            const h = JSON.parse(readFileSync("/tmp/stuck/picks.json", "utf8")).filter((p) => p.leaguePath === "atlas/dota2" && ["won","lost"].includes(p.status));
            const c = { agree: 0, disagree: 0, notFound: 0, failed: 0 };
            for (const p of h) { const a = await read(p); if (a.failed) c.failed++; else if (!a.result) c.notFound++; else gradePick(p, a.result) === p.status ? c.agree++ : c.disagree++; }
            console.log("OpenDota vs bo3.gg on", h.length, "Dota 2 picks:", JSON.stringify(c), JSON.stringify(read.errors));'
      - name: Browser tests (fixed board, the built pages in Chromium)
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Keep the browser-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: ui-screenshots, path: test-results/, if-no-files-found: ignore }
