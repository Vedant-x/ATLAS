name: Android app

# Builds ATLAS.apk (android/) when the app or its icons change. On main it is published as the
# "android" release, which the site links to:
#   https://github.com/Vedant-x/ATLAS/releases/download/android/ATLAS.apk
# Optional secrets for a fixed signing key (so a new APK installs over the old one):
#   ANDROID_KEYSTORE_B64 (base64 PKCS12), ANDROID_KEYSTORE_PASS, ANDROID_KEY_ALIAS
on:
  push:
    branches: [main]
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'icons/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # publishes the release

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Build ATLAS.apk
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash android/build.sh
      - uses: actions/upload-artifact@v6
        with: { name: ATLAS-apk, path: android/ATLAS.apk }
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "ATLAS for Android" --latest \
            --notes "Download ATLAS.apk below on your Android phone, open it and allow your browser to install apps when asked. The app shows the live site, so it is always up to date; live alerts arrive as Android notifications."
          gh release upload android android/ATLAS.apk --clobber
