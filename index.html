<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040406" />
  <title>ATLAS</title>
  <meta name="description" content="ATLAS sports intelligence: live fixtures, margin-free probabilities, every market priced, slips and edge board." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Security: scripts only from this site (plus WebAssembly for the on-device AI), no plugins, no base-URL tricks. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <!-- Fonts load without blocking the first paint (system fonts show until they arrive; main.js switches media). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" media="print" data-fonts />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" /></noscript>
  <link rel="stylesheet" href="css/style.css" />
  <script defer src="vendor/gsap.min.js"></script>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div id="preloader" aria-hidden="true">
    <div class="pl-word"><span>A</span><span>T</span><span>L</span><span>A</span><span>S</span></div>
    <div class="pl-meta"><span>SPORTS INTELLIGENCE SYSTEM</span><b data-count>000</b></div>
    <div class="pl-bar"><i></i></div>
  </div>

  <header class="bar">
    <a href="#/" class="logo" data-cursor="HOME">ATLAS<sup>®</sup></a>
    <nav class="top">
      <a href="#/" data-m="Home" aria-label="Dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Dashboard</span></a>
      <a href="#/sports" data-m="Sports" aria-label="Sports"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 0v18M3 12h18M5.6 5.6c3.5 3 9.3 3 12.8 0M5.6 18.4c3.5-3 9.3-3 12.8 0"/></svg><span>Sports</span></a>
      <a href="#/edge" data-m="Edge" aria-label="Edge board"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><span>Edge</span></a>
      <a href="#/x/2" data-m="Multi" aria-label="Multipliers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Multipliers</span></a>
      <a href="#/mega" data-m="Mega" aria-label="Mega bets"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l3 6.5 7 .9-5.1 4.8 1.3 7L12 17.8 5.8 21.2l1.3-7L2 9.4l7-.9z"/></svg><span>Mega</span></a>
      <a href="#/bankers" data-m="Bankers" aria-label="Bankers"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6"/></svg><span>Bankers</span></a>
    </nav>
    <button class="fx-btn" data-fx-toggle data-cursor="EFFECTS" title="Turn the 3D background on or off" aria-pressed="true">3D <b>ON</b></button>
    <button class="slip-btn" data-slip-toggle data-cursor="SLIP">Slip <b data-slip-count>0</b></button>
  </header>
  <div class="ticker" aria-label="Live ticker"><div class="ticker-track"></div></div>

  <main id="app"></main>

  <nav class="crumbs-dock" aria-label="Page navigation" hidden>
    <button class="dock-btn" data-nav-back data-cursor="BACK" aria-label="Back">← <span>Back</span></button>
    <a class="dock-btn" href="#/" data-cursor="HOME" aria-label="Home">⌂ <span>Home</span></a>
    <span class="dock-trail"></span>
  </nav>

  <aside id="slip" aria-label="Bet slip">
    <header><h2>Bet slip</h2><button data-slip-toggle aria-label="Close slip">×</button></header>
    <div class="slip-body"></div>
  </aside>

  <div id="wipe" aria-hidden="true"><b></b></div>

  <footer class="foot">
    <span>ATLAS · Sports intelligence</span>
    <span>18+ · Probabilities are estimates from prices and records, never guarantees. Bet only what you can afford to lose.</span>
    <nav class="foot-links"><a href="#/track">Track record</a><a href="#/responsible">Bet responsibly</a><a href="#/terms">Terms</a><a href="#/privacy">Privacy</a><button class="install-btn" data-install hidden>Install app</button></nav>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
